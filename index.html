  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be My Girlfriend?</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      max-width: 400px;
      animation: fadeIn 1s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    h1 {
      font-size: 28px;
      color: #e91e63;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #333;
    }
    button {
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 18px;
      margin: 10px;
      transition: 0.3s;
    }
    .yes {
      background: #e91e63;
      color: white;
    }
    .yes:hover {
      background: #d81b60;
    }
    .no {
      background: #eee;
      color: #333;
    }
    .no:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Isabella Pariat, will you be my girlfriend? 💖</h1>
    <p>Isabella, you make my world brighter every day. So... what do you say?</p>
    <button class="yes" onclick="sayYes()">YES 💘</button>
    <button class="no" onmouseover="moveNo(this)">NO 😢</button>
  </div>

  <script>
    function sayYes() {
      const win = window.open('', '_blank');
      win.document.write(`<!doctype html><html><head><title>Yay!</title>
      <style>body{font-family:Poppins,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#fff0f5;margin:0;color:#e91e63;text-align:center} .box{background:white;padding:40px;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,0.15);} h1{margin-bottom:10px;} p{font-size:20px;}</style>
      </head><body><div class='box'><h1>She Said YES! 💕🎉</h1><p>Welcome to our new beginning.</p></div></body></html>`);
    }

    function moveNo(btn) {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      btn.style.position = 'absolute';
      btn.style.left = x + 'px';
      btn.style.top = y + 'px';
      btn.style.pointerEvents = 'none'; // Makes it unclickable
      setTimeout(() => btn.style.pointerEvents = 'auto', 500); // Restores hover-only movement
    }
  </script>
</body>
</html>
    
  </body>
  
</html>
